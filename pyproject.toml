[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "itra-normalizer-demo"
version = "0.1.0"
description = "A vertical-slice demo that normalizes synthetic IT risk assessments."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "openai>=1.66.0",
  "pandas>=2.0.0",
  "pydantic>=2.7.0",
  "streamlit>=1.41.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pypdf>=5.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
